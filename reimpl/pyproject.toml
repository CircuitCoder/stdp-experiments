[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-delay-three-trace"
version = "0.1.0"
description = "Cross-simulator zero-delay Diehl-Cook three-trace experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]

